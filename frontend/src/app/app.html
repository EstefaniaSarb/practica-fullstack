<main class='contenedor'>
  <h1>Mis tareas</h1>

  <section class='formulario'>
    <input [(ngModel)]='titulo' placeholder='Título de la tarea' />
    <input [(ngModel)]='descripcion' placeholder='Descripción (opcional)' />
    <button (click)='agregar()'>Agregar</button>
  </section>

  @if (tareas().length === 0) {
    <p class='vacio'>No hay tareas todavía.</p>
  } @else {
    <ul>
      @for (t of tareas(); track t.id) {
        <li [class.hecha]='t.completada'>
          <input type='checkbox' [checked]='t.completada' (change)='alternar(t)' />
          <div class='texto'>
            <strong>{{ t.titulo }}</strong>
            <small>{{ t.descripcion }}</small>
          </div>
          <button class='borrar' (click)='eliminar(t)'>Eliminar</button>
        </li>
      }
    </ul>
  }
</main>
